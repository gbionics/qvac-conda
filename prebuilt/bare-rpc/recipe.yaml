schema_version: 1

context:
  version: "0.3.0"

package:
  name: bare-rpc
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/d4/03/b43630440ccebca425fca262855eb55cb143d48f7cc203e5113e22d26e69/bare_rpc-0.3.0.tar.gz
  sha256: 5c76c9b53c7c993d1717355fc3d6e6f6829fce2c7fd3ec61d60e279a6d207e81

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - compact-encoding >=0.1.0,<0.2

tests:
  - python:
      imports:
        - bare_rpc
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/holepunchto/bare-rpc-python
  summary: Pure Python bare-rpc codec and asynchronous RPC runtime
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
