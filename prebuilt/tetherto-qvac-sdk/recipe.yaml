context:
  # BEGIN RELEASE - maintained by scripts/update_prebuilt.py
  version: "0.25.0"
  build_number: 0
  wheel_linux_64: "tetherto_qvac_sdk-0.25.0-py3-none-manylinux_2_35_x86_64.whl"
  sha256_linux_64: "86221f0b2c5b54113416277714d7423ca8bf285f0de2789062661f00a2911901"
  wheel_linux_aarch64: "tetherto_qvac_sdk-0.25.0-py3-none-manylinux_2_35_aarch64.whl"
  sha256_linux_aarch64: "ca6c38bacca8f3f83d3a2b8a8a4f203ca05be12484a6349b2717deee69269e7e"
  wheel_osx_arm64: "tetherto_qvac_sdk-0.25.0-py3-none-macosx_13_0_arm64.whl"
  sha256_osx_arm64: "f249c102803195e2df3d4b581972e1dd265510daa5591e2080216283191b847e"
  wheel_win_64: "tetherto_qvac_sdk-0.25.0-py3-none-win_amd64.whl"
  sha256_win_64: "ea22aa4cb3b8766910fdfb3eff97b5c0f6662931af543c804eeeaec2050799c3"
  minimum_glibc: "2.35"
  minimum_osx: "13.0"
  # END RELEASE
  wheel: ${{ wheel_linux_64 if linux and x86_64 else wheel_linux_aarch64 if linux and aarch64 else wheel_osx_arm64 if osx and arm64 else wheel_win_64 }}
  wheel_sha256: ${{ sha256_linux_64 if linux and x86_64 else sha256_linux_aarch64 if linux and aarch64 else sha256_osx_arm64 if osx and arm64 else sha256_win_64 }}

package:
  name: tetherto-qvac-sdk
  version: ${{ version }}

source:
  - url: https://github.com/tetherto/qvac/releases/download/sdk-v${{ version }}/${{ wheel }}
    sha256: ${{ wheel_sha256 }}
    file_name: ${{ wheel }}

  # The stowed worker no longer includes loose license files.
  - url: https://raw.githubusercontent.com/tetherto/qvac/sdk-v${{ version }}/packages/inference/LICENSE
    sha256: 115146ca883126909247c429e0691b4f0a6c237e155036a4200cd224215a56df
    file_name: LICENSE
  - url: https://raw.githubusercontent.com/tetherto/qvac/sdk-v${{ version }}/packages/inference/NOTICE
    sha256: 672be3ed779631cb68db0100537cf82467d87fb284b45a0fb1ff610238fced47
    file_name: NOTICE

build:
  number: ${{ build_number }}
  python:
    version_independent: true
  skip: not (linux and (x86_64 or aarch64) or osx and arm64 or win and x86_64)
  # Upstream binaries use their own relative loader paths and signatures.
  dynamic_linking:
    binary_relocation: false
  script:
    content:
      - if: win
        then: '"%PYTHON%" "%RECIPE_DIR%/install.py"'
        else: '"$PYTHON" "$RECIPE_DIR/install.py"'
    env:
      c_stdlib_version: ${{ minimum_glibc }}

requirements:
  build:
    - if: linux
      then:
        - cf-nvidia-tools >=1,<2
        - binutils
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - bare-rpc >=0.3.0,<0.4
    - bare-sidecar >=0.1.3,<0.2
    - bare-stow-host >=0.2.1,<0.3
    - pydantic >=2.6,<3
    - if: linux
      then:
        - __glibc >=${{ minimum_glibc }}
        - libstdcxx-ng
        - libgcc-ng
    - if: osx
      then: __osx >=${{ minimum_osx }}

tests:
  - python:
      imports:
        - tetherto.qvac_sdk
        - tetherto.qvac_sdk.models
      python_version:
        - ${{ python_min }}.*
        - "3.11.*"
        - "3.12.*"
        - "3.13.*"
        - "3.14.*"
      pip_check: true
  - script: smoke_test.py
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/tetherto/qvac
  summary: QVAC Python SDK with the official bundled worker and Bare runtime
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  repository: https://github.com/tetherto/qvac
