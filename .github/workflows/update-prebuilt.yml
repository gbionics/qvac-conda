name: Check upstream SDK releases

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-prebuilt
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'gbionics/qvac-conda'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history, so the guard below can compare the update branch with main.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check all stable SDK releases
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_prebuilt.py
      # create-pull-request rebuilds its branch from main and force-pushes it, which
      # discards any commits a maintainer added to the PR. Leave such branches alone.
      - name: Keep hand-edited update branches
        id: guard
        if: steps.update.outputs.version != ''
        env:
          BRANCH: automation/update-prebuilt-sdk
          BOT: 41898282+github-actions[bot]@users.noreply.github.com
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          if ! git fetch --quiet --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            echo "No existing $BRANCH branch"
            exit 0
          fi
          # Any commit not made by this workflow (including GitHub "Update branch" merges) counts.
          manual=$(git log --format='%h %ce %s' "HEAD..origin/$BRANCH" | awk -v bot="$BOT" '$2 != bot')
          if [ -n "$manual" ]; then
            echo "hand_edited=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Update branch left unchanged::$BRANCH has commits not made by the updater, so the update to $VERSION was not applied. Merge or close its PR and delete the branch to resume automatic updates."
            {
              echo "### $BRANCH left unchanged"
              echo "Upstream SDK $VERSION is available, but the branch has commits not made by the updater:"
              echo '```'
              echo "$manual"
              echo '```'
              echo "Merge or close the PR and delete the branch to resume automatic updates."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: peter-evans/create-pull-request@v7
        id: pr
        if: steps.update.outputs.version != '' && steps.guard.outputs.hand_edited != 'true'
        with:
          branch: automation/update-prebuilt-sdk
          delete-branch: true
          # The default author is the user who last edited this workflow's schedule.
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          add-paths: prebuilt/tetherto-qvac-sdk/recipe.yaml
          commit-message: "Update prebuilt QVAC SDK to ${{ steps.update.outputs.version }}"
          title: "Update prebuilt QVAC SDK to ${{ steps.update.outputs.version }}"
          body: |
            Update the bundled SDK wheels to [sdk-v${{ steps.update.outputs.version }}](https://github.com/tetherto/qvac/releases/tag/sdk-v${{ steps.update.outputs.version }}).

            Refresh all four platform filenames, SHA-256 checksums, and minimum OS versions; reset the build number to zero.
            Review upstream dependency and license changes before merging.

            The updater dispatches **Build prebuilt packages** on this branch to validate the update.
      # GITHUB_TOKEN PRs do not trigger pull_request workflows; explicit dispatch does.
      - name: Validate the update branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prebuilt.yml --ref automation/update-prebuilt-sdk
